[workspace]
resolver = "2"
members = ["switch-io", "switch-formats", "switch-tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
switch-formats = { path = "switch-formats" }
switch-io = { path = "switch-io" }

aes = "=0.9.4"
clap = { version = "=4.6.7", features = ["derive"] }
configulator-rs = "=0.4.1"
ctr = "=0.10.1"
lz4_flex = { version = "=0.14.0", default-features = false, features = ["safe-decode", "safe-encode", "std"] }
rsa = { version = "=0.10.0", default-features = false, features = ["std"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
toml = "=1.2.1"
xts-mode = "=0.6.0"
zstd = { version = "=0.14.4", default-features = false }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
